workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.mathsprint.speed.arithmetic"
        KEY_ALIAS: "upload"
        KEY_PASSWORD: "Wrg06XrVBJZTf3g31a"
        KEYSTORE_PASSWORD: "Wrg06XrVBJZTf3g31a"
    scripts:
      - name: Set up keystore and signing
        script: |
          echo "Configuring signing properties..."
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Build Android Release AppBundle
        script: |
          flutter build appbundle --release
      - name: Build Android Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
